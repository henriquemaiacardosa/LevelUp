name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: levelup_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/levelup_test
      JWT_SECRET: segredo-apenas-para-ci

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage/lcov.info

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run coverage
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage/lcov.info

  sonar:
    needs: [test, frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage

      - uses: actions/download-artifact@v4
        with:
          name: cobertura-frontend
          path: frontend/coverage

      - name: Ajusta caminhos do lcov para a raiz do repositório
        run: |
          sed -i 's#^SF:src/#SF:backend/src/#' backend/coverage/lcov.info
          sed -i 's#^SF:src/#SF:frontend/src/#' frontend/coverage/lcov.info

      - name: Análise SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}