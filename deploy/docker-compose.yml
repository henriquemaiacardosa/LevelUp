services:
  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    logging:
      driver: awslogs
      options:
        awslogs-region: us-east-2
        awslogs-group: levelup-api
        awslogs-create-group: "true"
        awslogs-stream: api

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - API_DOMAIN=${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config: